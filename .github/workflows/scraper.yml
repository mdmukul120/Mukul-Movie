name: Auto Movie Extractor Pipeline (Every 30 Mins)

on:
  schedule:
    # প্রতি ৩০ মিনিট পর পর স্বয়ংক্রিয়ভাবে স্ক্রাপ করবে
    - cron: '*/30 * * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

concurrency:
  group: movie-scraper-pipeline
  cancel-in-progress: true

jobs:
  run-api-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Hidden API Scraper
      env:
        # API URL হাইড রাখতে GitHub Secrets ব্যবহার করা হচ্ছে
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
      run: |
        python scraper.py

    - name: Commit and Push Scraped Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/*.json
        git diff --staged --quiet || (git commit -m "Auto update movies data [30-min sync] [skip ci]" && git push)
